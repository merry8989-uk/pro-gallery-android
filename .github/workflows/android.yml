name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Least privilege, written down rather than inherited from the repository default. CI reads the
# code, builds it, and uploads artifacts. It never needs to write to the repository, so it cannot.
permissions:
  contents: read

jobs:
  build:
    name: Build debug APK & run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Both checkers existed and neither ran here, so they only ran when someone remembered.
      # They are pure Python and take seconds; the Kotlin one has caught real bugs (a missing
      # import, two companion objects, an event declared with no call site) and the docs one
      # catches a claim that has stopped being true.
      - name: Check the code and the docs
        run: |
          python3 tools/check_kotlin.py
          python3 tools/check_docs.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Cache debug keystore (fallback when no signing secret is set)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Configure signing key
        run: |
          if [ -n "${{ secrets.PROGALLERY_KEYSTORE_BASE64 }}" ]; then
            echo "Signing with the repository key (stable across builds)."
            echo "${{ secrets.PROGALLERY_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/progallery.p12"
            {
              echo "storeFile=$RUNNER_TEMP/progallery.p12"
              echo "storePassword=${{ secrets.PROGALLERY_STORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.PROGALLERY_KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.PROGALLERY_KEY_PASSWORD }}"
              echo "storeType=PKCS12"
            } > keystore.properties
          else
            echo "::warning::No signing secret configured - falling back to the default debug key; in-place upgrades may not work."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace


      - name: Upload the exported Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/**
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pro-gallery-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # The keystore is written to $RUNNER_TEMP because Gradle needs a file, not a secret. The runner
      # is destroyed after the job either way — this removes it from the disk once the build that
      # needed it has run.
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/progallery.p12" "$RUNNER_TEMP/signing.properties"

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    # Real SQLite and the real framework, which unit tests cannot provide: this is
    # where the migration is actually executed and validated against the exported
    # schema, and where the instrumented suite runs.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Install the emulator and system image (with retries)
        run: |
          # The runner image occasionally caches a truncated package, which fails as
          # "Error on ZipFile unknown archive". Clearing the SDK temp directory and
          # retrying is what gets past it; the emulator-runner action then finds the
          # packages already present.
          packages='platforms;android-36 build-tools;36.0.0 emulator system-images;android-35;google_apis;x86_64'
          for attempt in 1 2 3; do
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            if sdkmanager --install $packages > /dev/null 2>&1; then
              echo "SDK packages ready (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt failed; clearing partial downloads and retrying"
            rm -rf "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/.temp" 2>/dev/null || true
            sleep 15
          done
          echo "::error::could not install the emulator and system image after 3 attempts"
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected/**
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Supply-chain checks. Two questions this job answers that nothing else did:
  #   dependencyCheck      — does anything on the classpath have a known CVE?
  #   generateLicenseReport — what licences does this app ship, and is any of it copyleft?
  #
  # **This job does not block a release yet, and that is deliberate.** A first run against an
  # existing dependency set almost always finds something, and making it blocking on day one would
  # mean either an unreviewed suppression file or a permanently red build. It reports; a person
  # reads; then `failBuildOnCVSS` in app/build.gradle.kts decides.
  #
  # It is a separate job rather than a step in `build` so a supply-chain finding never hides a
  # compile or test failure, and so it can be re-run on its own.
  # ---------------------------------------------------------------------------------------------
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # `--continue` so a finding does not stop the run before the report is uploaded: the report is
      # the useful artefact, and a red step with no report is a red step nobody can act on.
      - name: OWASP dependency check
        run: ./gradlew :app:dependencyCheckAnalyze --continue

      - name: Upload dependency check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: app/build/reports/dependency-check-report.*
          if-no-files-found: warn

      # A licence report that fails should not fail the job: the licences are a decision for a
      # person, and the report is what they read to make it.
      - name: Licence report
        continue-on-error: true
        run: ./gradlew :app:generateLicenseReport

      - name: Upload licence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licence-report
          path: app/build/reports/licenses/**
          if-no-files-found: warn

