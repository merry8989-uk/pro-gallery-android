name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: false
        default: 'v1.0.1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build debug APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Cache debug keystore (fallback when no signing secret is set)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Configure signing key
        run: |
          if [ -n "${{ secrets.PROGALLERY_KEYSTORE_BASE64 }}" ]; then
            echo "Signing with the repository key (stable across builds)."
            echo "${{ secrets.PROGALLERY_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/progallery.p12"
            {
              echo "storeFile=$RUNNER_TEMP/progallery.p12"
              echo "storePassword=${{ secrets.PROGALLERY_STORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.PROGALLERY_KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.PROGALLERY_KEY_PASSWORD }}"
              echo "storeType=PKCS12"
            } > keystore.properties
          else
            echo "::warning::No signing secret configured - falling back to the default debug key; in-place upgrades may not work."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/pro-gallery-debug.apk \;
          ls -la out

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || 'v1.0.1' }}
          name: ProGallery ${{ github.event.inputs.tag || 'v1.0.1' }} — debug APK
          body: |
            Debug build of **ProGallery**, a native Android gallery app (Kotlin, Jetpack Compose, Material 3)
            with MediaStore indexing, deep SAF scanning, duplicate detection and photo/video editing.

            **Install:** download `pro-gallery-debug.apk` below and open it on your Android 8.0+ device
            (you will need to allow installs from this source).

            This is a debug build, signed with the Android debug key — fine for testing and sideloading,
            not for Play Store distribution. See the README for release-signing instructions.
          files: out/pro-gallery-debug.apk
          draft: false
          prerelease: false
