name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build debug APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/pro-gallery-debug.apk \;
          ls -la out

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ProGallery v1.0.0 — debug APK
          body: |
            Debug build of **ProGallery**, a native Android gallery app (Kotlin, Jetpack Compose, Material 3)
            with MediaStore indexing, deep SAF scanning, duplicate detection and photo/video editing.

            **Install:** download `pro-gallery-debug.apk` below and open it on your Android 8.0+ device
            (you will need to allow installs from this source).

            This is a debug build, signed with the Android debug key — fine for testing and sideloading,
            not for Play Store distribution. See the README for release-signing instructions.
          files: out/pro-gallery-debug.apk
          draft: false
          prerelease: false
