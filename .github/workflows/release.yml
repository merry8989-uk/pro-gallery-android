name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: false
        default: 'v1.0.1'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build debug APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Cache debug keystore (fallback when no signing secret is set)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Configure signing key
        run: |
          if [ -n "${{ secrets.PROGALLERY_KEYSTORE_BASE64 }}" ]; then
            echo "Signing with the repository key (stable across builds)."
            echo "${{ secrets.PROGALLERY_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/progallery.p12"
            {
              echo "storeFile=$RUNNER_TEMP/progallery.p12"
              echo "storePassword=${{ secrets.PROGALLERY_STORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.PROGALLERY_KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.PROGALLERY_KEY_PASSWORD }}"
              echo "storeType=PKCS12"
            } > keystore.properties
          else
            echo "::warning::No signing secret configured - falling back to the default debug key; in-place upgrades may not work."
          fi

      - name: Resolve the release tag
        id: release_tag
        run: |
          # A tag push must publish under the pushed tag; a manual run uses the
          # supplied input. There is deliberately no fallback to a hard-coded
          # version - that is what previously published a v1.5.x tag push as
          # "v1.0.1".
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            echo "Triggered by tag push: ${tag}"
          else
            tag="${{ github.event.inputs.tag }}"
            echo "Triggered manually with input: ${tag}"
          fi

          if [ -z "$tag" ]; then
            echo "::error::No tag could be resolved. Push a 'v*' tag, or supply the 'tag' input on a manual run."
            exit 1
          fi

          case "$tag" in
            v*) ;;
            *)
              echo "::error::Tag '$tag' must start with 'v' (for example v1.5.1)."
              exit 1
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/pro-gallery-debug.apk \;
          ls -la out

      - name: Build signed release bundle (Play-ready AAB)
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Collect AAB
        run: |
          find app/build/outputs/bundle -name '*.aab' -exec cp {} out/pro-gallery-release.aab \;
          ls -la out

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ProGallery ${{ steps.release_tag.outputs.tag }} — debug APK
          body: |
            Debug build of **ProGallery**, a native Android gallery app (Kotlin, Jetpack Compose, Material 3)
            with MediaStore indexing, deep SAF scanning, duplicate detection and photo/video editing.

            **Install:** download `pro-gallery-debug.apk` below and open it on your Android 8.0+ device
            (you will need to allow installs from this source).

            **Two files are attached:**

            * `pro-gallery-debug.apk` — the build that is exercised by the automated tests. Sideload
              this one. It is a debug build, so it is not for Play Store distribution.
            * `pro-gallery-release.aab` — a signed release bundle (minified with R8), built for Play.
              It compiles and signs in CI, but it has **not** been run on a device: R8 has not been
              exercised at runtime here. Treat it as ready to test, not as verified.

            See the README for release-signing instructions.
          files: |
            out/pro-gallery-debug.apk
            out/pro-gallery-release.aab
          draft: false
          prerelease: false
